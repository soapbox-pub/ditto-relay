name: Test

# Clippy and the tests, on every branch push and every Nostr PR. Tags are
# release.yml's.
#
# `["*", "**"]`: ngit-ci treats a bare `*` as matching every branch, slashes
# included, and a bare `**` as matching none; GitHub splits the two the other
# way. The pair is right under both.

on:
  push:
    branches: ["*", "**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml says which Rust; rustup installs it, with clippy.
      - name: Install Rust
        run: |
          set -eu
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - name: Restore the Rust build cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: test-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: test-

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

[dev-dependencies]
rand = "0.10.3"
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"

# A smaller, faster binary, from a build that takes several minutes every time.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1

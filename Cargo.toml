[package]
name = "ditto-relay"
version = "2.2.0"
edition = "2024"
description = "High-performance Nostr relay on LMDB, with search and a web of trust"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
# Tor, built in, for serving the relay as an onion service. Pinned exactly,
# Arti and its crates together: the relay uses APIs Arti still marks
# experimental, which change between its releases.
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "onion-service-service", "onion-service-cli-extra", "ephemeral-keystore", "vanguards", "hs-pow-full", "static-sqlite"] }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4"
hex = "0.4.3"
libc = "0.2.190"
# Raw LMDB, wrapped in src/lmdb.rs. heed can't seek or count within a key's
# sorted duplicates, which the indexes are built on.
lmdb-master-sys = "0.2.6"
# The TLS Arti speaks to Tor relays with, which leaves choosing its
# cryptography to the application.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
safelog = "0.10"
secp256k1 = { version = "0.33.1", features = ["global-context"] }
serde = { version = "1.0.229", features = ["derive"] }
# Arti's settings in the config file, with keys it doesn't know refused.
serde_ignored = "0.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tantivy = "0.26"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "process", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tor-cell = "=0.47.0"
tor-config = "=0.47.0"
tor-config-path = "=0.47.0"
tor-hscrypto = "=0.47.0"
tor-hsservice = "=0.47.0"
tor-keymgr = "=0.47.0"
tor-llcrypto = "=0.47.0"
tor-proto = "=0.47.0"
tor-rtcompat = "=0.47.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vader-parity = "0.1.0"
whatlang = "0.18.0"

# Soapbox's fork of Arti, a branch per release it patches: relay selection
# compares family members as plain bytes, where upstream's constant-time
# comparison cost ~0.4 s of CPU per relay picked, and each onion service
# descriptor upload gets at least 120 seconds, where upstream gave up on slow
# HSDirs after 30 and never published to them. The branch must match the
# release arti-client is pinned to. Every Arti crate is listed: the fork's
# crates depend on each other by path, so one taken from crates.io would be a
# second copy whose types don't match.
[patch.crates-io]
arti-client              = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
caret                    = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
equix                    = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
fs-mistrust              = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
fslock-guard             = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
hashx                    = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
oneshot-fused-workaround = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }

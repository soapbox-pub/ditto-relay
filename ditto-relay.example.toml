# Ditto Relay configuration. The relay reads the file --config names, or else
# the first of ~/.config/ditto-relay/ditto-relay.toml and
# /etc/ditto-relay/ditto-relay.toml.
#
# Only url is required; the rest are shown with their defaults, or with an
# example where one is unset by default, commented out with "#" where their
# descriptions have "# ". A key the relay doesn't know is refused. Relative
# paths are relative to this file.

###############################################################################
# General
###############################################################################

# The relay's own URL, which NIP-42 authentication and NIP-62 requests to
# vanish name it by.
url = "wss://relay.example.com/"

# Where the relay is reached over HTTP(S), which its icon and banner are linked
# from. Defaults to url with ws:// made http:// and wss:// made https://.
#public_url = "https://relay.example.com/"

# Where clients are served. Defaults to 127.0.0.1:13131, for a reverse proxy to
# forward to, or with [tls] on to [::]:443.
#bind = "127.0.0.1:13131"

# Where to serve Prometheus metrics, apart from clients. "" turns them off.
#metrics_bind = "127.0.0.1:13133"

# The header a reverse proxy puts the client's IP in, such as "x-real-ip",
# "x-forwarded-for", or "cf-connecting-ip". Unset, the peer's address is used.
#real_ip_header = "x-real-ip"

# What to log, as tracing EnvFilter directives. Tor's own routine is kept out
# of the log by default: the relay says itself when its onion is reachable, and
# when it has been unreachable for long.
#log = "info,tantivy=warn,arti_client=warn,tor_=warn,tor_hsservice=error,tor_circmgr::hspool=error"

###############################################################################
# Storage
###############################################################################

# Holds the database, in db/, and the search index, in search/. Defaults to
# /var/lib/ditto-relay as root, else ~/.local/share/ditto-relay.
#data_dir = "/var/lib/ditto-relay"

# LMDB map size in bytes: virtual address space, not disk usage.
#map_size = 1099511627776

###############################################################################
# NIP-11
###############################################################################

#name = "Ditto Relay"

#description = ""

# The operator's pubkey, in 64 lowercase hex, which the web of trust is also
# rooted at unless wot_seeds says otherwise. Unset by default.
#pubkey = "<your pubkey in hex>"

# Another way to reach the operator, such as an email or a web page. Unset by
# default.
#contact = "mailto:admin@example.com"

# The relay software's homepage. "" leaves it out.
#software = "https://gitworkshop.dev/soapbox.pub/ditto-relay"

# URLs of the relay's icon, which should be square, and banner. Unset, the
# relay's own are linked, from public_url (or the onion, over Tor). "" leaves
# one out.
#icon = "https://relay.example.com/icon.png"
#banner = "https://relay.example.com/banner.jpg"

###############################################################################
# The relay's key
###############################################################################

# A file holding the relay's secret key in 64 lowercase hex, which signs the
# NIP-85 assertions the relay serves and the trends it labels, and is given as
# "self" in NIP-11. Made, with a new key, if it doesn't exist: back it up to
# keep the relay's identity. Defaults to secret.key in data_dir.
#secret_key_file = "/var/lib/ditto-relay/secret.key"

# Whether NIP-85 trusted assertions are served.
#nip85 = true

# How many seconds apart trends are labeled. 0 turns them off.
#trends_interval = 900

# How many seconds a trend label is kept.
#trends_expiration = 691200

###############################################################################
# Limits
###############################################################################

#max_message_size = 4000000
#max_subscriptions = 20
#max_filters = 100
#max_subid_length = 100
#default_limit = 100
#max_limit = 1000

# The most values one field of a filter may list.
#max_filter_values = 20000

# Events with created_at further than this many seconds ahead are rejected.
#max_future_seconds = 900

###############################################################################
# Access (NIP-42)
###############################################################################

# Kinds only the parties to an event may read, once they've authenticated: its
# author, and the pubkeys it tags. A filter naming one of them has to name only
# authenticated pubkeys as its authors or #p, a filter naming no kinds doesn't
# see them, and events asked for by id are checked one by one. None by default:
# reads are open to everyone, since authenticating to read ties a client's IP
# to its pubkey. For DMs, app data, and gift wraps: [4, 78, 1059, 30078].
#auth_kinds = []

###############################################################################
# Indexing
###############################################################################

# Tags with names longer than a letter to index, so filter by.
#indexed_tags = ["proxy", "client", "content-warning"]

# Whether replaceable and addressable events keep the versions they replace.
#history = true

# Kinds whose old versions aren't kept.
#history_excluded_kinds = [30382, 30383, 30384, 30385]

# The most versions of an address kept, current included.
#history_max_versions = 20

###############################################################################
# Search (NIP-50)
###############################################################################

#search = true

# Every kind's text is searchable but these, whose content isn't text:
# reposts, encrypted kinds, lists and sets, and zap receipts. Autocomplete
# covers every kind.
#search_excluded_kinds = [3, 4, 6, 13, 16, 1059, 9735, 10000, 10001, 10002, 10003, 10004, 10005, 10006, 10007, 10009, 10012, 10013, 10015, 10020, 10030, 10050, 10101, 10102, 30000, 30002, 30003, 30004, 30005, 30006, 30007, 30015, 30030, 31234, 31924, 39089, 39092]

# How often, at most, new events become searchable.
#search_commit_ms = 1000

# Hashtags that mark media as adult, for the nsfw: extension. Defaults to a
# built-in list.
#nsfw_hashtags = ["nsfw"]

###############################################################################
# Syncing (NIP-77)
###############################################################################

# Whether clients and other relays may sync with negentropy.
#negentropy = true

# The most events one sync may cover. A filter matching more is refused.
#negentropy_max_events = 1000000

###############################################################################
# Web of trust and ranking
###############################################################################

# Hex pubkeys the web of trust is rooted at. Defaults to pubkey's, if set;
# [] turns it off.
#wot_seeds = []

# How likely trust is to pass along a follow rather than stop.
#wot_damping = 0.85

# How many people's worth of trust weighs fully.
#wot_full_trust = 100000

# The least weight counted; less is 0.
#wot_min_weight = 0.01

# About how many follows to push trust along, or targets to rescore, per turn.
#wot_budget = 10000

# How many seconds it takes sort:hot to halve an event's worth.
#hot_half_life = 86400

# How far an engager's weight must move before what they've engaged with is
# rescored.
#rank_step = 0.05

###############################################################################
# Write policy
###############################################################################

# A strfry write policy plugin's command, run with sh -c. Unset by default.
#write_policy_plugin = "/usr/local/bin/my-plugin"

# How long the plugin may take to answer before it's restarted.
#write_policy_timeout_seconds = 10

###############################################################################
# HTTPS
###############################################################################

# Serve HTTPS (wss://) on bind with no reverse proxy in front, with a
# certificate from Let's Encrypt for public_url's domain, renewed on its own.
# Needs DNS for the domain pointing here, ports 443 and 80 open to the
# internet, and root or CAP_NET_BIND_SERVICE, which the systemd unit gives.
# Turning it on agrees to the CA's terms of service. Leave real_ip_header unset
# with it: there's no proxy to set the header, so clients could. This table,
# like [tor]'s, has to come after every setting that isn't in one.
#[tls]
#enabled = false

# An address the CA may write to about the certificate. Unset by default.
#email = "admin@example.com"

# The CA's ACME directory. Try a new setup against Let's Encrypt's staging CA,
# https://acme-staging-v02.api.letsencrypt.org/directory, which has no rate
# limits to run into but isn't trusted by clients.
#directory = "https://acme-v02.api.letsencrypt.org/directory"

# Where plain HTTP is redirected to HTTPS, and the CA's HTTP-01 challenges are
# answered when its TLS-ALPN-01 ones, on bind, can't be. "" turns it off.
#http_bind = "[::]:80"

# Holds the ACME account and the certificate, both with private keys. Defaults
# to tls/ in data_dir.
#dir = "/var/lib/ditto-relay/tls"

###############################################################################
# Tor
###############################################################################

# Serve the relay as a Tor onion service too, with Tor built in: there's
# nothing else to install. The onion's address is logged at startup, and its
# clients are shown it on the landing page and in NIP-11, and may name it in
# NIP-42 AUTH and NIP-62 requests to vanish. They reach the write policy plugin
# as sourceType "Tor", with no address. These tables have to come after every
# other setting in the file.
#[tor]
#enabled = false

# Holds the onion's key, unless key_file says otherwise, and Tor's state/ and
# cache/, which make it faster and safer to start but can be lost. It, and
# every directory above it, must not be writable by other users. Defaults to
# tor/ in data_dir.
#dir = "/var/lib/ditto-relay/tor"

# The onion's secret key, which its address is made from. It's in C Tor's
# format, so a HiddenServiceDir's hs_ed25519_secret_key can be used to keep
# that onion's address. Made, with a new address, if it doesn't exist.
#key_file = "/var/lib/ditto-relay/tor/hs_ed25519_secret_key"

# The port the onion answers on.
#port = 80

# Whether the landing page, when public_url is https, tells Tor Browser about
# the onion with an Onion-Location header.
#onion_location = true

# The onion service's own settings, as arti.toml takes them under
# [onion_services.<name>]. For example:
#[tor.service]

# Introduction points, from 1 to 20.
#num_intro_points = 3

# Streams a circuit may have open at once before it's torn down.
#max_concurrent_streams_per_circuit = 65535

# How many introductions a second each introduction point may send.
#rate_limit_at_intro = { rate = 100, burst = 200 }

# Ask clients for proof of work when the service is overwhelmed.
#enable_pow = false

# Tor's own settings, as arti.toml takes them, except for storage's
# directories and keystore, which dir and key_file decide. For example:
#[tor.arti]
#vanguards.mode = "full"
#storage.permissions.dangerously_trust_everyone = false
